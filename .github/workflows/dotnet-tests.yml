name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target-framework: [net8.0, net48]
        exclude:
          - os: ubuntu-latest
            target-framework: net48

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x

    - name: Restore
      run: dotnet restore GuidKit.Tests/GuidKit.Tests.csproj

    - name: Build
      run: dotnet build GuidKit.Tests/GuidKit.Tests.csproj --framework ${{ matrix.target-framework }} --configuration Release --no-restore

    - name: Test
      run: dotnet test GuidKit.Tests/GuidKit.Tests.csproj --framework ${{ matrix.target-framework }} --configuration Release --no-build